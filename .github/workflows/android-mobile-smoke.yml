name: CodeSaga Android Emulator Smoke Tests
permissions:
  contents: read
jobs:
  android-appium-smoke:
    name: Build APK and run real Android Appium smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22
        cache: npm
    - name: Set up Java for Android build
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
      with:
        distribution: temurin
        java-version: '17'
    - name: Install JavaScript dependencies
      run: 'npm ci

        npm --prefix appium-tests ci

        '
    - name: Build current web assets for the existing Android WebView app
      run: "npm run build\nrm -rf android/app/src/main/assets\nmkdir -p android/app/src/main/assets\ncp -R dist/. android/app/src/main/assets/\n\
        printf 'sdk.dir=%s\\n' \"$ANDROID_HOME\" > android/local.properties\nmkdir -p \"$HOME/.android\"\nif [ ! -f \"$HOME/.android/debug.keystore\"\
        \ ]; then\n  keytool -genkeypair -keystore \"$HOME/.android/debug.keystore\" -storepass android -alias androiddebugkey -keypass android\
        \ -keyalg RSA -validity 10000 -dname \"CN=Android Debug,O=Android,C=US\"\nfi\n"
    - name: Build CodeSaga debug APK (retry transient Maven timeouts)
      run: "cd android\n# React Native's Android AARs are large; Maven Central can intermittently\n# time out on hosted runners. Retry while preserving\
        \ Gradle's downloaded cache.\nfor attempt in 1 2 3; do\n  echo \"Android build attempt $attempt/3\"\n  if java -classpath gradle/wrapper/gradle-wrapper.jar\
        \ org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon \\\n    -Dorg.gradle.internal.http.socketTimeout=120000 \\\n    -Dorg.gradle.internal.http.connectionTimeout=60000;\
        \ then\n    exit 0\n  fi\n  if [ \"$attempt\" -lt 3 ]; then\n    echo \"Gradle build failed; waiting 15 seconds before retry.\"\n    sleep\
        \ 15\n  fi\ndone\necho \"Android build failed after three attempts.\"\nexit 1\n"
    - name: Enable hardware acceleration for Android emulator
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Run Appium smoke suite on Android emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: bash scripts/run-android-smoke.sh
    - name: Upload Android evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: android-appium-evidence
        path: '/tmp/codesaga-appium.log

          /tmp/codesaga-logcat.log

          appium-tests/results/

          appium-tests/Appium_Test_Cases_Report.xlsx

          android/app/build/outputs/apk/debug/app-debug.apk

          '
        if-no-files-found: ignore
        retention-days: 14
'on':
  workflow_dispatch: {}
