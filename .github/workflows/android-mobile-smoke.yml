name: CodeSaga Android Emulator Smoke Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-appium-smoke:
    name: Build APK and run real Android Appium smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
          cache: npm
      - name: Set up Java for Android build
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix appium-tests install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build CodeSaga debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Run Appium smoke suite on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            export ANDROID_APP_PATH="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            export ANDROID_PLATFORM_VERSION="15"
            npx --prefix appium-tests appium driver install uiautomator2
            npx --prefix appium-tests appium --port 4723 --base-path / > /tmp/codesaga-appium.log 2>&1 &
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:4723/status >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:4723/status
            cd appium-tests
            npx mocha tests/mobile-smoke-tests.js --timeout 120000
      - name: Upload Appium server log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-appium-smoke-failure-logs
          path: /tmp/codesaga-appium.log
          if-no-files-found: ignore
          retention-days: 14
