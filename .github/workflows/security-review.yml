name: Security Review & DevSecOps Automation

"on":
  push:
    branches: [ main, master, 'security/**' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: 🛡️ Defensive SAST & Security Review
    # Runner: Explicitly pinned to ubuntu-24.04 LTS to ensure predictable scanner environments
    # and address the ubuntu-latest -> Ubuntu 26.04 migration notice (actions/runner-images#14748).
    # Ubuntu 24.04 LTS is officially supported through 2029 and verified compatible with
    # Gitleaks 8.x, Semgrep SAST, Aqua Trivy, and Node.js 20/24 toolchains.
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (official release commit SHA targeting Node.js 24)
        with:
          fetch-depth: 0

      - name: Remove previous generated security evidence
        run: |
          rm -rf 'Vulnerability Test Results/evidence'
          rm -f 'Vulnerability Test Results/Security_Review_Report.xlsx'

      - name: 2. Setup Node.js Environment (v20)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (official release commit SHA targeting Node.js 24)
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Detect Backend Technology Stack
        id: detect-tech
        run: |
          echo "Detecting application backend technology..."
          if [ -f "package.json" ]; then
            echo "TECH_STACK=Node.js / Express" >> $GITHUB_ENV
            echo "Framework: Node.js / Express"
          elif [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            echo "TECH_STACK=Java Spring Boot" >> $GITHUB_ENV
          elif [ -f "requirements.txt" ] || [ -f "Pipfile" ]; then
            echo "TECH_STACK=Python (Django/Flask/FastAPI)" >> $GITHUB_ENV
          fi

      - name: 4. Install Application Dependencies
        run: |
          echo "Installing dependencies..."
          npm ci

      - name: 4b. Validate Expo CLI and Zod compatibility
        run: npx expo config --type public > /tmp/codesaga-expo-config.json

      - name: 8. Collect validated dependency audit evidence
        run: |
          node scripts/collect-security-evidence.js
          cp 'Vulnerability Test Results/evidence/root-npm-audit.json' npm-audit-results.json
          cp 'Vulnerability Test Results/evidence/selenium-npm-audit.json' selenium-npm-audit-results.json
          cp 'Vulnerability Test Results/evidence/appium-npm-audit.json' appium-npm-audit-results.json
      - name: 8b. Run isolated security regression harness
        run: |
          set -o pipefail
          node scripts/test-security-authorization.mjs | tee 'Vulnerability Test Results/evidence/security-regression.log'
      - name: 9. Generate Security & Excel Reports
        run: |
          echo "Generating DevSecOps reports..."
          node scripts/generate-security-excel-report.js
          node scripts/verify-submission-reports.mjs

      - name: 5. Run Gitleaks Secret Detection Scan
        id: gitleaks
        run: |
          echo "Running Gitleaks secret detection..."
          GITLEAKS_VERSION="8.18.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp/
          /tmp/gitleaks detect --source="." --report-format="json" --report-path="gitleaks-results.json" --exit-code=0
          node -e "const r=require('./gitleaks-results.json'); console.log('Gitleaks findings:',r.length); if(r.length) process.exit(1)"

      - name: 6. Run Semgrep SAST Analysis
        id: semgrep
        run: |
          echo "Running Semgrep SAST scan..."
          python3 -m pip install semgrep --break-system-packages
          semgrep scan --config "p/security-audit" --config "p/owasp-top-ten" --json --output semgrep-results.json

      - name: 7. Run Trivy Filesystem Vulnerability Scan
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (verified official release commit SHA)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'
          hide-progress: 'true'

      - name: 10. Summarize actual scanner and audit evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const model = JSON.parse(fs.readFileSync('Vulnerability Test Results/evidence/security-summary.json', 'utf8'));
          const semgrep = JSON.parse(fs.readFileSync('semgrep-results.json', 'utf8'));
          const secrets = JSON.parse(fs.readFileSync('gitleaks-results.json', 'utf8'));
          if (!Array.isArray(semgrep.results) || !Array.isArray(secrets)) throw new Error('Invalid scanner evidence');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Security evidence\nCommit: ${model.commit}\n\nRegistered findings: ${model.groups.at(-1).discovered} (see CSV for remediation claims).\nGitleaks findings: ${secrets.length}. Semgrep findings: ${semgrep.results.length}; scanner errors: ${semgrep.errors?.length ?? 0}.\n\n${model.audits.map(a => `${a.scope}: ${a.critical} critical, ${a.high} high, ${a.moderate} moderate, ${a.low} low.`).join('\n')}\n\nPassing dependency gates does not certify complete mobile coverage or resolve residual Low findings.\n`);
          NODE
      - name: 11. Enforce High-and-Critical Dependency Security Gate Across All Scopes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const scopes = [
            ['root application', 'npm-audit-results.json'],
            ['Selenium test tooling', 'selenium-npm-audit-results.json'],
            ['Appium test tooling', 'appium-npm-audit-results.json'],
            ['Load test tooling', 'Vulnerability Test Results/evidence/load-npm-audit.json']
          ];
          let blockedCount = 0;
          for (const [scope, path] of scopes) {
            let report;
            try { report = JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch { console.error(`Missing or invalid audit report for ${scope}: ${path}`); process.exitCode = 1; continue; }
            const totals = report.metadata?.vulnerabilities;
            if (report.error || !totals || !report.vulnerabilities) {
              console.error(`Audit did not produce a valid report for ${scope}; failing closed.`);
              process.exitCode = 1;
              continue;
            }
            console.log(`${scope}: ${totals.critical} critical, ${totals.high} high, ${totals.moderate} moderate, ${totals.low} low.`);
            const blocked = Object.entries(report.vulnerabilities)
              .filter(([, item]) => item.severity === 'critical' || item.severity === 'high');
            blockedCount += blocked.length;
            for (const [name, item] of blocked) console.error(`BLOCKED [${scope}] ${name}: ${item.severity}`);
          }
          if (blockedCount) {
            console.error(`Security gate failed: ${blockedCount} high/critical package findings remain across audited scopes.`);
            process.exitCode = 1;
          } else if (!process.exitCode) {
            console.log('High-and-critical dependency gate passed for all four scopes.');
          }
          NODE

      - name: 11b. Enforce registered application security blockers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const model = JSON.parse(fs.readFileSync('Vulnerability Test Results/evidence/security-summary.json', 'utf8'));
          const application = model.groups.find(g => g.scope === 'Application code (SEC)');
          if (application.pending) {
            console.error(`Release blocked: ${application.pending} application-code register finding(s) remain pending. See findings.csv, including reopened SEC-01.`);
            process.exitCode = 1;
          }
          NODE

      - name: 12. Upload Security Reports & Excel Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: security-vulnerability-test-reports
          path: |
            Vulnerability Test Results/
            Vulnerability Test Results/Security_Review_Report.xlsx
            gitleaks-results.json
            semgrep-results.json
            npm-audit-results.json
            selenium-npm-audit-results.json
            appium-npm-audit-results.json
            trivy-fs-report.txt
          retention-days: 30
          if-no-files-found: error
