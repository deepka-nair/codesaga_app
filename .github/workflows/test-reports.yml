name: CodeSaga Test Automation & 4 Excel Reports Bundle

permissions:
  contents: write

on:
  push:
    branches: [ main, master, 'security/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  execute-tests-and-upload-artifacts:
    name: 🚀 Execute All 4 Test Suites & Upload Excel Reports Bundle
    # Runner: Explicitly pinned to ubuntu-24.04 LTS to ensure predictable execution environments
    # and address the ubuntu-latest -> Ubuntu 26.04 migration notice (actions/runner-images#14748).
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (official release commit SHA targeting Node.js 24)
        with:
          persist-credentials: true

      - name: 2. Set up Node.js Environment (v20)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (official release commit SHA targeting Node.js 24)
        with:
          node-version: 22
          cache: 'npm'

      - name: 2b. Setup Chrome for Headless Selenium WebDriver
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0 (official release commit SHA targeting Node.js 24)
        with:
          chrome-version: stable

      - name: 3. Install Application Dependencies (Root & Test Suites)
        run: |
          echo "Installing root application dependencies..."
          npm ci || npm install

          echo "Installing Selenium Web test dependencies..."
          cd selenium-tests && (npm ci || npm install) && cd ..

          echo "Installing Appium Mobile test dependencies..."
          cd appium-tests && (npm ci || npm install) && cd ..

          echo "Installing API Load test dependencies..."
          cd load-tests && (npm ci || npm install) && cd ..

      - name: 3a. Apply compatible Appium dependency security fixes
        run: |
          cd appium-tests
          npm audit fix || echo "::warning::Some Appium advisories require further compatibility work; retaining the updated lockfile for inspection."
          npm audit --json > /tmp/appium-audit-after-fix.json 2>&1 || true
          cd ..

      - name: 3b. Commit regenerated Appium lockfile when Appium major version changes
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -m "Appium lockfile generated by dependency install" -- appium-tests/package-lock.json
          git fetch origin "$GITHUB_HEAD_REF"
          if ! git rebase "origin/$GITHUB_HEAD_REF"; then
            git rebase --abort || true
            git stash pop || true
            echo "::warning::Another CI run changed the branch concurrently; this run will not overwrite its lockfile."
            exit 0
          fi
          git stash pop || true
          cd appium-tests
          npm install --package-lock-only --ignore-scripts --force
          node -e "const p=require('./package-lock.json'); const a=p.packages['node_modules/appium']?.version; const w=p.packages['node_modules/webdriverio']?.version; console.log('Regenerated versions:', {appium:a, webdriverio:w}); if (!a?.startsWith('3.') || !w?.startsWith('10.')) process.exit(1)"
          cd ..
          git add appium-tests/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(appium): regenerate lockfile for Appium 3"
            if ! git push origin "HEAD:$GITHUB_HEAD_REF"; then
              git fetch origin "$GITHUB_HEAD_REF"
              if git rebase "origin/$GITHUB_HEAD_REF"; then
                git push origin "HEAD:$GITHUB_HEAD_REF"
              else
                git rebase --abort || true
                echo "::warning::Concurrent lockfile update conflicted; leaving the other successful commit intact."
                exit 0
              fi
            fi
          else
            echo "Appium lockfile already matches package.json."
          fi
      - name: 4. Start Express Backend & Vite Frontend Services
        env:
          PORT: 5000
          FRONTEND_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:5000
        run: |
          echo "Starting Express API Backend on port 5000..."
          node server.js > backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend started with PID $BACKEND_PID (logs: backend.log)"

          echo "Starting Vite Frontend Dev Server on port 5173..."
          npm run dev -- --host 0.0.0.0 --port 5173 > frontend.log 2>&1 &
          FRONTEND_PID=$!
          echo "Frontend started with PID $FRONTEND_PID (logs: frontend.log)"

          echo "Waiting for services to become healthy (bounded check, max 60s)..."
          BACKEND_OK=0
          FRONTEND_OK=0

          for i in {1..60}; do
            if [ $BACKEND_OK -eq 0 ] && curl -s -f -o /dev/null http://localhost:5000/api/health; then
              echo "  ✅ Express Backend is healthy on port 5000 (${i}s)"
              BACKEND_OK=1
            fi

            if [ $FRONTEND_OK -eq 0 ] && curl -s -f -o /dev/null http://localhost:5173; then
              echo "  ✅ Vite Frontend is healthy on port 5173 (${i}s)"
              FRONTEND_OK=1
            fi

            if [ $BACKEND_OK -eq 1 ] && [ $FRONTEND_OK -eq 1 ]; then
              echo "🚀 Both services are online and healthy after ${i} second(s)!"
              break
            fi

            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "❌ Backend process (PID $BACKEND_PID) exited unexpectedly!"
              break
            fi
            if ! kill -0 $FRONTEND_PID 2>/dev/null; then
              echo "❌ Frontend process (PID $FRONTEND_PID) exited unexpectedly!"
              break
            fi

            sleep 1
          done

          if [ $BACKEND_OK -ne 1 ] || [ $FRONTEND_OK -ne 1 ]; then
            echo "❌ Service startup check failed! Printing logs:"
            echo "==================== BACKEND LOGS (backend.log) ===================="
            cat backend.log 2>/dev/null || echo "No backend.log found"
            echo "==================== FRONTEND LOGS (frontend.log) ===================="
            cat frontend.log 2>/dev/null || echo "No frontend.log found"
            echo "======================================================================"
            exit 1
          fi

      - name: 5. Execute Suite 1 - Selenium Web E2E Test Suite (310 Test Cases)
        run: |
          echo "Running 310 Selenium Web E2E test cases..."
          cd selenium-tests && npm test

      - name: 6. Execute Suite 2 - Appium Mobile E2E Test Suite (310 Test Cases)
        run: |
          echo "Running 310 Appium Mobile E2E test cases..."
          cd appium-tests && npm test
          echo "::notice title=Suite 2 (Appium Mobile E2E)::STATUS: BLOCKED / NOT RUN (0 Passed, 310 Blocked). Mobile hardware virtualization and Appium 2.x server are unavailable in headless CI runner. Report generated with 310 Blocked test records."

      - name: 7. Execute Suite 3 - API Baseline & Load Test Suite (100 VUs / 60s)
        run: |
          echo "Running 60s API Baseline Load Test..."
          cd load-tests
          node baseline-load-test.js
          echo "Running dedicated SEC-02 authentication rate-limiting stress test..."
          node auth-stress-test.js
          node scripts/generate-excel-report.js

      - name: 8. Execute Suite 4 - DevSecOps SAST Security & Vulnerability Audit
        run: |
          echo "Running DevSecOps SAST & Security Review Audit..."
          node scripts/generate-security-excel-report.js

      - name: 9. Bundle All 4 Excel Reports into test-reports/ Directory
        if: always()
        run: |
          echo "Bundling generated Excel test reports..."
          node scripts/prepare-test-reports.js

      - name: 10. Upload Combined Artifact (all-4-test-excel-reports-bundle)
        id: upload-bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: all-4-test-excel-reports-bundle
          path: test-reports/*.xlsx
          retention-days: 90
          if-no-files-found: ignore

      - name: 11. Upload Individual Artifact - Selenium Web Excel Report
        id: upload-selenium
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: selenium-web-e2e-report-excel
          path: selenium-tests/Login_Test_Cases_Report.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: 11b. Upload Selenium Failure Screenshots (if any)
        id: upload-screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: selenium-failure-screenshots
          path: selenium-tests/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 11c. Upload Service Startup Logs (backend.log & frontend.log)
        id: upload-logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: service-startup-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 12. Upload Individual Artifact - Appium Mobile Excel Report
        id: upload-appium
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: appium-mobile-e2e-report-excel
          path: appium-tests/Appium_Test_Cases_Report.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: 13. Upload Individual Artifact - API Load Test Excel Report
        id: upload-api-load
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: api-load-test-report-excel
          path: load-tests/Baseline_Load_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: 14. Upload Individual Artifact - Security Review Excel Report
        id: upload-security
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (official release commit SHA targeting Node.js 24)
        with:
          name: security-review-report-excel
          path: Vulnerability Test Results/Security_Review_Report.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: 15. Publish Final CI Summary with Direct Artifact Links
        if: always()
        run: |
          echo "Publishing final GitHub Actions execution summary with direct artifact links..."
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "## 📊 CodeSaga Test Execution & Report Bundle Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Test Suite | Status | Passed | Failed | Blocked | Scope / Target |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: | :---: | :---: | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Suite 1: Selenium Web E2E** | See Selenium job result | See generated Excel/console output | See generated Excel/console output | 0 | Chrome Headless vs Live Web App |" >> $GITHUB_STEP_SUMMARY
            echo "| **Suite 2: Appium Mobile E2E** | ⚠️ **INCOMPLETE** | See Appium report | See Appium report | See Appium report | 310 registered scenarios; many are placeholders and require live Appium assertions |" >> $GITHUB_STEP_SUMMARY
            echo "| **Suite 3: API Baseline & Load** | See load-test output | See generated Excel/console output | See generated Excel/console output | 0 | 100 VUs / 60s; use measured results below |" >> $GITHUB_STEP_SUMMARY
            echo "| **Suite 4: DevSecOps SAST & Security** | See audit output | See findings.csv and audit report | See findings.csv and audit report | See findings.csv and audit report | Counts must match generated audit evidence; no hardcoded remediation totals |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Uploaded CI Artifacts (Run #${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
            echo "| Artifact Name | Direct Download Link | Artifact ID | Retention |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
            echo "| **All 4 Excel Reports Bundle** | [Download all-4-test-excel-reports-bundle](${{ steps.upload-bundle.outputs.artifact-url }}) | \`${{ steps.upload-bundle.outputs.artifact-id }}\` | 90 days |" >> $GITHUB_STEP_SUMMARY
            echo "| **1. Selenium Web E2E Report** | [Download selenium-web-e2e-report-excel](${{ steps.upload-selenium.outputs.artifact-url }}) | \`${{ steps.upload-selenium.outputs.artifact-id }}\` | 30 days |" >> $GITHUB_STEP_SUMMARY
            echo "| **2. Appium Mobile E2E Report** | [Download appium-mobile-e2e-report-excel](${{ steps.upload-appium.outputs.artifact-url }}) | \`${{ steps.upload-appium.outputs.artifact-id }}\` | 30 days |" >> $GITHUB_STEP_SUMMARY
            echo "| **3. API Load Test Report** | [Download api-load-test-report-excel](${{ steps.upload-api-load.outputs.artifact-url }}) | \`${{ steps.upload-api-load.outputs.artifact-id }}\` | 30 days |" >> $GITHUB_STEP_SUMMARY
            echo "| **4. Security Review Report** | [Download security-review-report-excel](${{ steps.upload-security.outputs.artifact-url }}) | \`${{ steps.upload-security.outputs.artifact-id }}\` | 30 days |" >> $GITHUB_STEP_SUMMARY
            echo "| **Service Startup Logs** | [Download service-startup-logs](${{ steps.upload-logs.outputs.artifact-url }}) | \`${{ steps.upload-logs.outputs.artifact-id }}\` | 7 days |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> 🔗 **All Run Artifacts**: [View Artifacts on GitHub Run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
          fi
