name: CodeSaga Test Suites Automation & Excel Reports Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Selenium Web E2E Test Suite
  # =========================================================================
  selenium-web-e2e:
    name: 🌐 Selenium Web E2E Suite (310 Test Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Chrome for Headless Selenium WebDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Application Dependencies
        run: npm ci || npm install

      - name: Start CodeSaga Application in Background
        run: |
          node server.js &
          npm run dev &
          npx wait-on -t 30000 http-get://localhost:5000/api/health http-get://localhost:5173

      - name: Install Selenium Test Dependencies
        working-directory: ./selenium-tests
        run: npm ci || npm install

      - name: Execute 310 Selenium Web E2E Tests
        working-directory: ./selenium-tests
        run: npm test

      - name: Upload Selenium Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-e2e-report-excel
          path: selenium-tests/Login_Test_Cases_Report.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 2: Appium Mobile E2E Test Suite
  # =========================================================================
  appium-mobile-e2e:
    name: 📱 Appium Mobile E2E Suite (310 Test Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Appium Suite Dependencies
        working-directory: ./appium-tests
        run: npm ci || npm install

      - name: Execute 310 Appium Mobile E2E Tests
        working-directory: ./appium-tests
        run: npm test

      - name: Upload Appium Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-e2e-report-excel
          path: appium-tests/Appium_Test_Cases_Report.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 3: API Baseline & Load Testing Suite
  # =========================================================================
  api-baseline-load-test:
    name: ⚡ API Baseline & Load Testing Suite (100 VUs / 60s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root & Load Test Dependencies
        run: |
          npm ci || npm install
          cd load-tests && (npm ci || npm install)

      - name: Start CodeSaga Target Server
        run: node load-tests/mock-server.js & sleep 3

      - name: Execute 60s Baseline Load Test
        working-directory: ./load-tests
        run: node baseline-load-test.js

      - name: Generate Load Test Excel Report
        working-directory: ./load-tests
        run: node scripts/generate-excel-report.js

      - name: Upload API Load Test Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-load-test-report-excel
          path: load-tests/Baseline_Load_Test_Report.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 4: DevSecOps SAST & Vulnerability Audit Suite
  # =========================================================================
  devsecops-security-audit:
    name: 🛡️ DevSecOps SAST & Security Review Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies for Excel Generator
        run: cd selenium-tests && (npm ci || npm install)

      - name: Generate Security Excel Report
        run: node scripts/generate-security-excel-report.js

      - name: Upload Security Audit Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-security-review-report-excel
          path: Vulnerability Test Results/Security_Review_Report.xlsx
          retention-days: 30

  # =========================================================================
  # JOB 5: Consolidated Bundle Artifact Upload (All 4 Excel Reports)
  # =========================================================================
  consolidated-reports-bundle:
    name: 📦 Download All 4 Test Excel Reports Bundle
    needs: [selenium-web-e2e, appium-mobile-e2e, api-baseline-load-test, devsecops-security-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Reports Directory
        run: |
          mkdir -p all-excel-reports
          cd selenium-tests && (npm ci || npm install) && cd ..
          cd appium-tests && (npm ci || npm install) && cd ..
          node load-tests/scripts/generate-excel-report.js || true
          node scripts/generate-security-excel-report.js || true
          
          cp selenium-tests/Login_Test_Cases_Report.xlsx all-excel-reports/1_Selenium_Web_E2E_Test_Report.xlsx || true
          cp appium-tests/Appium_Test_Cases_Report.xlsx all-excel-reports/2_Appium_Mobile_E2E_Test_Report.xlsx || true
          cp load-tests/Baseline_Load_Test_Report.xlsx all-excel-reports/3_API_Baseline_Load_Test_Report.xlsx || true
          cp "Vulnerability Test Results/Security_Review_Report.xlsx" all-excel-reports/4_DevSecOps_Security_Review_Report.xlsx || true

      - name: Upload All 4 Excel Reports Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-4-test-excel-reports-bundle
          path: all-excel-reports/*.xlsx
          retention-days: 90
